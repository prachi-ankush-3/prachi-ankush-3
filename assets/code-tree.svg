<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Code becoming a digital forest tree">
  <defs>
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#263021"/>
      <stop offset="55%" stop-color="#3D4432"/>
      <stop offset="100%" stop-color="#95A27D"/>
    </linearGradient>
    <filter id="branchGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="canopy" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#95A27D" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#3D4432" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="420" fill="#0D1117"/>
  <rect width="900" height="420" fill="#11160F" opacity="0.7"/>
  <circle cx="450" cy="170" r="160" fill="url(#canopy)"/>
  <g font-family="Courier New, monospace" font-size="11">
    <text x="120" y="20" fill="#3D4432">commit</text>
    <text x="210" y="8" fill="#72805F">push</text>
    <text x="300" y="18" fill="#3D4432">build</text>
    <text x="560" y="12" fill="#72805F">merge</text>
    <text x="650" y="22" fill="#3D4432">deploy</text>
    <text x="740" y="10" fill="#58634A">solve</text>
    <animateTransform attributeName="transform" type="translate" values="0 -30; 0 90" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.15" dur="5s" repeatCount="indefinite"/>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#branchGlow)">
    <path d="M450 390 C448 320 452 250 450 175" stroke="url(#trunk)" stroke-width="7" stroke-dasharray="240" stroke-dashoffset="240">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="2.2s" fill="freeze"/>
    </path>
    <path d="M450 250 C390 230 330 200 280 150" stroke="#3D4432" stroke-width="3" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="2s" begin="1.4s" fill="freeze"/>
    </path>
    <path d="M450 250 C510 230 570 205 640 160" stroke="#3D4432" stroke-width="3" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="2s" begin="1.5s" fill="freeze"/>
    </path>
    <path d="M450 200 C400 170 360 120 340 70" stroke="#72805F" stroke-width="2.2" stroke-dasharray="180" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="1.8s" begin="2.2s" fill="freeze"/>
    </path>
    <path d="M450 200 C500 165 545 115 580 68" stroke="#72805F" stroke-width="2.2" stroke-dasharray="180" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="1.8s" begin="2.3s" fill="freeze"/>
    </path>
    <path d="M280 150 C250 120 230 90 210 50" stroke="#95A27D" stroke-width="1.6" stroke-dasharray="140" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="1.5s" begin="2.8s" fill="freeze"/>
    </path>
    <path d="M640 160 C670 128 700 95 730 52" stroke="#95A27D" stroke-width="1.6" stroke-dasharray="140" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="1.5s" begin="2.9s" fill="freeze"/>
    </path>
    <path d="M340 70 C320 50 300 36 278 22" stroke="#B8C4A3" stroke-width="1.2" stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.2s" begin="3.4s" fill="freeze"/>
    </path>
    <path d="M580 68 C605 48 630 32 655 18" stroke="#B8C4A3" stroke-width="1.2" stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="1.2s" begin="3.5s" fill="freeze"/>
    </path>
    <path d="M450 175 C430 140 420 95 410 40" stroke="#95A27D" stroke-width="2" stroke-dasharray="160" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="1.7s" begin="2.1s" fill="freeze"/>
    </path>
    <path d="M450 175 C470 138 485 92 500 38" stroke="#95A27D" stroke-width="2" stroke-dasharray="160" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="1.7s" begin="2.2s" fill="freeze"/>
    </path>
    <path d="M450 390 C390 400 300 404 180 408" stroke="#263021" stroke-width="2" stroke-dasharray="280" stroke-dashoffset="280">
      <animate attributeName="stroke-dashoffset" from="280" to="0" dur="2s" begin="0.4s" fill="freeze"/>
    </path>
    <path d="M450 390 C510 400 620 406 740 410" stroke="#263021" stroke-width="2" stroke-dasharray="280" stroke-dashoffset="280">
      <animate attributeName="stroke-dashoffset" from="280" to="0" dur="2s" begin="0.5s" fill="freeze"/>
    </path>
    <path d="M450 390 C420 408 360 416 250 418" stroke="#1B2117" stroke-width="1.4" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1.8s" begin="0.8s" fill="freeze"/>
    </path>
    <path d="M450 390 C480 408 560 416 680 418" stroke="#1B2117" stroke-width="1.4" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1.8s" begin="0.9s" fill="freeze"/>
    </path>
  </g>
  <g fill="#95A27D">
    <circle cx="278" cy="22" r="2.2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.5s" fill="freeze"/>
    </circle>
    <circle cx="655" cy="18" r="2.2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.6s" fill="freeze"/>
    </circle>
    <circle cx="410" cy="40" r="2.4" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.2s" fill="freeze"/>
    </circle>
    <circle cx="500" cy="38" r="2.4" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.3s" fill="freeze"/>
    </circle>
    <circle cx="210" cy="50" r="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.7s" fill="freeze"/>
    </circle>
    <circle cx="730" cy="52" r="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.8s" fill="freeze"/>
    </circle>
  </g>
  <text x="450" y="408" text-anchor="middle" fill="#58634A" font-family="Courier New, monospace" font-size="11" letter-spacing="3">CODE  ’  ROOT  ’  BRANCH  ’  FOREST</text>
</svg>
