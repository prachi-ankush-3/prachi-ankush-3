<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 430"
     role="img"
     aria-label="Prachi developer terminal animation">

  <defs>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing clips -->
    <clipPath id="line1">
      <rect x="55" y="90" width="0" height="24">
        <animate attributeName="width"
                 from="0" to="190"
                 dur="0.6s"
                 begin="0.5s"
                 fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line2">
      <rect x="55" y="122" width="0" height="24">
        <animate attributeName="width"
                 from="0" to="270"
                 dur="0.7s"
                 begin="1.2s"
                 fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line3">
      <rect x="55" y="154" width="0" height="24">
        <animate attributeName="width"
                 from="0" to="390"
                 dur="0.9s"
                 begin="2s"
                 fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line4">
      <rect x="55" y="186" width="0" height="24">
        <animate attributeName="width"
                 from="0" to="520"
                 dur="1.1s"
                 begin="3s"
                 fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line5">
      <rect x="55" y="218" width="0" height="24">
        <animate attributeName="width"
                 from="0" to="430"
                 dur="0.9s"
                 begin="4.2s"
                 fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line6">
      <rect x="55" y="250" width="0" height="24">
        <animate attributeName="width"
                 from="0" to="470"
                 dur="1s"
                 begin="5.2s"
                 fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="line7">
      <rect x="55" y="282" width="0" height="24">
        <animate attributeName="width"
                 from="0" to="400"
                 dur="0.8s"
                 begin="6.3s"
                 fill="freeze"/>
      </rect>
    </clipPath>

  </defs>

  <!-- Background -->
  <rect width="900"
        height="430"
        rx="18"
        fill="#0B0F14"/>

  <!-- Terminal border -->
  <rect x="15"
        y="15"
        width="870"
        height="400"
        rx="15"
        fill="none"
        stroke="#30363D"
        stroke-width="2"/>

  <!-- Terminal header -->
  <rect x="15"
        y="15"
        width="870"
        height="48"
        rx="15"
        fill="#161B22"/>

  <!-- Window buttons -->
  <circle cx="42" cy="39" r="7" fill="#FF5F56"/>
  <circle cx="65" cy="39" r="7" fill="#FFBD2E"/>
  <circle cx="88" cy="39" r="7" fill="#27C93F"/>

  <!-- Terminal title -->
  <text x="450"
        y="44"
        text-anchor="middle"
        fill="#8B949E"
        font-family="Courier New, monospace"
        font-size="14">
    prachi@developer: ~
  </text>

  <!-- Main font -->
  <style>
    .code {
      font-family: "Courier New", Courier, monospace;
      font-size: 18px;
    }

    .small {
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
    }
  </style>

  <!-- Prompt -->
  <text x="55"
        y="80"
        class="small"
        fill="#95A27D">
    &gt; initializing_developer.exe
  </text>

  <!-- Code -->
  <text x="55"
        y="108"
        class="code"
        fill="#72805F"
        clip-path="url(#line1)">
    class Developer {
  </text>

  <text x="55"
        y="140"
        class="code"
        fill="#8B949E"
        clip-path="url(#line2)">
    name = "Prachi";
  </text>

  <text x="55"
        y="172"
        class="code"
        fill="#B8C4A3"
        clip-path="url(#line3)">
    role = "Software Engineer";
  </text>

  <text x="55"
        y="204"
        class="code"
        fill="#B8C4A3"
        clip-path="url(#line4)">
    skills = ["Java", "Python", "C++"];
  </text>

  <text x="55"
        y="236"
        class="code"
        fill="#B8C4A3"
        clip-path="url(#line5)">
    cloud = ["AWS", "Cloud"];
  </text>

  <text x="55"
        y="268"
        class="code"
        fill="#B8C4A3"
        clip-path="url(#line6)">
    development = ["Android", "Web"];
  </text>

  <text x="55"
        y="300"
        class="code"
        fill="#B8C4A3"
        clip-path="url(#line7)">
    exploring = ["AI", "Problem Solving"];
  </text>

  <!-- Closing brace -->
  <text x="55"
        y="332"
        class="code"
        fill="#72805F">
    }
  </text>

  <!-- Success message -->
  <text x="55"
        y="365"
        class="small"
        fill="#95A27D"
        opacity="0">

    ✓ BUILD SUCCESSFUL — ready to create.

    <animate attributeName="opacity"
             from="0"
             to="1"
             dur="0.5s"
             begin="7.4s"
             fill="freeze"/>
  </text>

  <!-- Cursor -->
  <rect x="55"
        y="374"
        width="9"
        height="18"
        fill="#95A27D"
        filter="url(#glow)">

    <animate attributeName="x"
             values="55;245;55;325;55;580;55;520"
             dur="7.4s"
             fill="freeze"/>

    <animate attributeName="y"
             values="90;122;154;186;218;250;282;342"
             dur="7.4s"
             fill="freeze"/>

    <animate attributeName="opacity"
             values="1;0;1"
             dur="0.8s"
             repeatCount="indefinite"/>

  </rect>

  <!-- Bottom status -->
  <text x="830"
        y="392"
        text-anchor="end"
        class="small"
        fill="#58634A">
    ● ONLINE
  </text>

</svg>
