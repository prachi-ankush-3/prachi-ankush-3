<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" role="img" aria-label="Forest fireflies">
  <defs>
    <filter id="fly" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="90" fill="#0D1117"/>
  <g filter="url(#fly)">
    <circle cx="70" cy="40" r="1.6" fill="#95A27D">
      <animate attributeName="cx" values="70;90;55;80;70" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;28;50;34;40" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.25;0.9;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="58" r="1.3" fill="#FFFFFF">
      <animate attributeName="cx" values="160;140;175;155;160" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="58;44;62;48;58" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.85;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="30" r="1.5" fill="#B8C4A3">
      <animate attributeName="cx" values="250;270;240;260;250" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;48;26;42;30" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.15;0.8;0.2" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="62" r="1.4" fill="#95A27D">
      <animate attributeName="cx" values="360;340;380;350;360" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="62;40;70;50;62" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.95;0.2" dur="4.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="36" r="1.7" fill="#FFFFFF">
      <animate attributeName="cx" values="470;490;455;480;470" dur="10.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="36;22;52;30;36" dur="10.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;1;0.2;0.7;0.15" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="50" r="1.3" fill="#95A27D">
      <animate attributeName="cx" values="580;560;600;570;580" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;64;38;58;50" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.15" dur="3.4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="28" r="1.5" fill="#B8C4A3">
      <animate attributeName="cx" values="680;700;665;690;680" dur="11.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="28;46;20;40;28" dur="11.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;1;0.2" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="54" r="1.4" fill="#95A27D">
      <animate attributeName="cx" values="790;770;810;785;790" dur="12.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="54;36;66;44;54" dur="12.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.95;0.2;0.8;0.1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="40" r="1.2" fill="#FFFFFF">
      <animate attributeName="cx" values="840;855;830;848;840" dur="9.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;55;32;48;40" dur="9.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.15" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
