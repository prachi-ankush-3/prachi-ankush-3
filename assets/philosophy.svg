<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" role="img" aria-label="Developer philosophy">
  <rect width="900" height="110" fill="#0D1117"/>
  <text x="450" y="68" text-anchor="middle" fill="#FFFFFF" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="36" font-weight="700" letter-spacing="6">BUILD. BREAK. LEARN. FIX. REPEAT.</text>
  <line x1="80" y1="88" x2="820" y2="88" stroke="#3D4432" stroke-width="1"/>
  <line x1="80" y1="88" x2="820" y2="88" stroke="#95A27D" stroke-width="1.5" stroke-dasharray="20 180">
    <animate attributeName="stroke-dashoffset" values="0;-200" dur="5s" repeatCount="indefinite"/>
  </line>
</svg>
