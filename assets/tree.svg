<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 500"
     role="img"
     aria-label="Prachi's code growing into a digital tree">

  <defs>

    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1D2619"/>
      <stop offset="45%" stop-color="#11170F"/>
      <stop offset="100%" stop-color="#080B09"/>
    </radialGradient>

    <!-- Tree trunk -->
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#20291C"/>
      <stop offset="45%" stop-color="#526044"/>
      <stop offset="100%" stop-color="#B8C4A3"/>
    </linearGradient>

    <!-- Branch gradient -->
    <linearGradient id="branch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#58634A"/>
      <stop offset="100%" stop-color="#B8C4A3"/>
    </linearGradient>

    <!-- Canopy -->
    <radialGradient id="canopy">
      <stop offset="0%" stop-color="#95A27D" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#72805F" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground -->
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11170F"/>
      <stop offset="50%" stop-color="#3D4432"/>
      <stop offset="100%" stop-color="#11170F"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Clip -->
    <clipPath id="terminal">
      <rect x="25" y="25" width="950" height="450" rx="18"/>
    </clipPath>

  </defs>

  <!-- ================= BACKGROUND ================= -->

  <rect width="1000"
        height="500"
        fill="#080B09"/>

  <rect x="25"
        y="25"
        width="950"
        height="450"
        rx="18"
        fill="url(#bgGlow)"
        stroke="#30382A"
        stroke-width="1.5"/>

  <!-- Ambient glow -->
  <circle cx="500"
          cy="235"
          r="190"
          fill="url(#canopy)"
          filter="url(#softGlow)"/>

  <!-- ================= TERMINAL HEADER ================= -->

  <g clip-path="url(#terminal)">

    <rect x="25"
          y="25"
          width="950"
          height="48"
          fill="#11160F"/>

    <line x1="25"
          y1="73"
          x2="975"
          y2="73"
          stroke="#30382A"/>

    <!-- Window buttons -->
    <circle cx="52" cy="49" r="6" fill="#58634A"/>
    <circle cx="73" cy="49" r="6" fill="#72805F"/>
    <circle cx="94" cy="49" r="6" fill="#95A27D"/>

    <text x="500"
          y="54"
          text-anchor="middle"
          fill="#72805F"
          font-family="Courier New, monospace"
          font-size="13">
      prachi@developer ~ /growth
    </text>

    <!-- ================= FALLING CODE ================= -->

    <g font-family="Courier New, monospace"
       font-size="11"
       fill="#72805F"
       opacity=".55">

      <text x="75" y="-20">010101</text>
      <text x="180" y="-70">git push</text>
      <text x="305" y="-30">while(true)</text>
      <text x="650" y="-55">npm run build</text>
      <text x="820" y="-20">deploy()</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -20; 0 520"
        dur="7s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".65;.08"
        dur="7s"
        repeatCount="indefinite"/>

    </g>

    <g font-family="Courier New, monospace"
       font-size="10"
       fill="#58634A"
       opacity=".4">

      <text x="120" y="120">01001001</text>
      <text x="760" y="145">10110101</text>
      <text x="170" y="250">&lt;/&gt;</text>
      <text x="820" y="300">{ }</text>
      <text x="80" y="330">commit()</text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -120; 0 400"
        dur="9s"
        repeatCount="indefinite"/>

    </g>

    <!-- ================= TITLE ================= -->

    <text x="500"
          y="108"
          text-anchor="middle"
          fill="#B8C4A3"
          font-family="Courier New, monospace"
          font-size="21"
          font-weight="bold"
          letter-spacing="2">

      CODE → CREATE → GROW

    </text>

    <text x="500"
          y="128"
          text-anchor="middle"
          fill="#58634A"
          font-family="Courier New, monospace"
          font-size="11"
          letter-spacing="3">

      EVERY LINE BUILDS SOMETHING

    </text>


    <!-- ================= TREE ================= -->

    <!-- Tree shadow -->
    <ellipse cx="500"
             cy="405"
             rx="270"
             ry="25"
             fill="#000"
             opacity=".35"/>

    <!-- Roots -->
    <g fill="none"
       stroke-linecap="round"
       filter="url(#glow)">

      <path d="M500 365 C455 405 370 420 240 430"
            stroke="#263021"
            stroke-width="4"
            stroke-dasharray="330"
            stroke-dashoffset="330">

        <animate
          attributeName="stroke-dashoffset"
          from="330"
          to="0"
          dur="2s"
          begin="1s"
          fill="freeze"/>

      </path>

      <path d="M500 365 C545 405 630 420 760 430"
            stroke="#263021"
            stroke-width="4"
            stroke-dasharray="330"
            stroke-dashoffset="330">

        <animate
          attributeName="stroke-dashoffset"
          from="330"
          to="0"
          dur="2s"
          begin="1.1s"
          fill="freeze"/>

      </path>

      <path d="M500 365 C475 410 420 440 330 450"
            stroke="#1B2117"
            stroke-width="2"
            stroke-dasharray="250"
            stroke-dashoffset="250">

        <animate
          attributeName="stroke-dashoffset"
          from="250"
          to="0"
          dur="1.8s"
          begin="1.3s"
          fill="freeze"/>

      </path>

      <path d="M500 365 C525 410 580 440 670 450"
            stroke="#1B2117"
            stroke-width="2"
            stroke-dasharray="250"
            stroke-dashoffset="250">

        <animate
          attributeName="stroke-dashoffset"
          from="250"
          to="0"
          dur="1.8s"
          begin="1.4s"
          fill="freeze"/>

      </path>

    </g>


    <!-- Main trunk -->
    <path d="M500 385
             C495 330 505 275 500 225
             C495 185 500 155 500 130"

          fill="none"
          stroke="url(#trunk)"
          stroke-width="10"
          stroke-linecap="round"
          filter="url(#glow)"

          stroke-dasharray="270"
          stroke-dashoffset="270">

      <animate
        attributeName="stroke-dashoffset"
        from="270"
        to="0"
        dur="2.5s"
        fill="freeze"/>

    </path>


    <!-- ================= MAIN BRANCHES ================= -->

    <g fill="none"
       stroke="url(#branch)"
       stroke-linecap="round"
       filter="url(#glow)">

      <!-- Left -->
      <path d="M500 275 C440 255 385 220 325 170"
            stroke-width="4"
            stroke-dasharray="230"
            stroke-dashoffset="230">

        <animate attributeName="stroke-dashoffset"
                 from="230" to="0"
                 dur="1.8s"
                 begin="1.8s"
                 fill="freeze"/>

      </path>

      <!-- Right -->
      <path d="M500 275 C560 250 620 215 680 165"
            stroke-width="4"
            stroke-dasharray="230"
            stroke-dashoffset="230">

        <animate attributeName="stroke-dashoffset"
                 from="230" to="0"
                 dur="1.8s"
                 begin="1.9s"
                 fill="freeze"/>

      </path>

      <!-- Upper left -->
      <path d="M500 220 C455 185 420 145 395 105"
            stroke-width="3"
            stroke-dasharray="180"
            stroke-dashoffset="180">

        <animate attributeName="stroke-dashoffset"
                 from="180" to="0"
                 dur="1.5s"
                 begin="2.5s"
                 fill="freeze"/>

      </path>

      <!-- Upper right -->
      <path d="M500 220 C545 180 580 140 610 100"
            stroke-width="3"
            stroke-dasharray="180"
            stroke-dashoffset="180">

        <animate attributeName="stroke-dashoffset"
                 from="180" to="0"
                 dur="1.5s"
                 begin="2.6s"
                 fill="freeze"/>

      </path>

      <!-- Far left -->
      <path d="M325 170 C285 145 250 115 225 80"
            stroke-width="2"
            stroke-dasharray="150"
            stroke-dashoffset="150">

        <animate attributeName="stroke-dashoffset"
                 from="150" to="0"
                 dur="1.3s"
                 begin="3.1s"
                 fill="freeze"/>

      </path>

      <!-- Far right -->
      <path d="M680 165 C720 140 755 110 780 75"
            stroke-width="2"
            stroke-dasharray="150"
            stroke-dashoffset="150">

        <animate attributeName="stroke-dashoffset"
                 from="150" to="0"
                 dur="1.3s"
                 begin="3.2s"
                 fill="freeze"/>

      </path>

      <!-- Top branches -->
      <path d="M395 105 C375 80 355 65 330 50"
            stroke-width="1.8"
            stroke-dasharray="100"
            stroke-dashoffset="100">

        <animate attributeName="stroke-dashoffset"
                 from="100" to="0"
                 dur="1s"
                 begin="3.7s"
                 fill="freeze"/>

      </path>

      <path d="M610 100 C635 75 655 60 680 45"
            stroke-width="1.8"
            stroke-dasharray="100"
            stroke-dashoffset="100">

        <animate attributeName="stroke-dashoffset"
                 from="100" to="0"
                 dur="1s"
                 begin="3.8s"
                 fill="freeze"/>

      </path>

    </g>


    <!-- ================= SKILL NODES ================= -->

    <g font-family="Courier New, monospace"
       font-size="11"
       text-anchor="middle">

      <!-- Java -->
      <g opacity="0">
        <circle cx="225" cy="80" r="7"
                fill="#95A27D"
                filter="url(#glow)"/>

        <text x="225" y="63"
              fill="#B8C4A3">
          JAVA
        </text>

        <animate attributeName="opacity"
                 from="0" to="1"
                 dur=".5s"
                 begin="4.2s"
                 fill="freeze"/>
      </g>

      <!-- AWS -->
      <g opacity="0">
        <circle cx="780" cy="75" r="7"
                fill="#95A27D"
                filter="url(#glow)"/>

        <text x="780" y="58"
              fill="#B8C4A3">
          AWS
        </text>

        <animate attributeName="opacity"
                 from="0" to="1"
                 dur=".5s"
                 begin="4.3s"
                 fill="freeze"/>
      </g>

      <!-- Android -->
      <g opacity="0">
        <circle cx="330" cy="50" r="6"
                fill="#72805F"
                filter="url(#glow)"/>

        <text x="330" y="35"
              fill="#B8C4A3">
          ANDROID
        </text>

        <animate attributeName="opacity"
                 from="0" to="1"
                 dur=".5s"
                 begin="4.4s"
                 fill="freeze"/>
      </g>

      <!-- Web -->
      <g opacity="0">
        <circle cx="680" cy="45" r="6"
                fill="#72805F"
                filter="url(#glow)"/>

        <text x="680" y="30"
              fill="#B8C4A3">
          WEB
        </text>

        <animate attributeName="opacity"
                 from="0" to="1"
                 dur=".5s"
                 begin="4.5s"
                 fill="freeze"/>
      </g>

      <!-- AI -->
      <g opacity="0">
        <circle cx="395" cy="105" r="6"
                fill="#95A27D"
                filter="url(#glow)"/>

        <text x="395" y="90"
              fill="#B8C4A3">
          AI
        </text>

        <animate attributeName="opacity"
                 from="0" to="1"
                 dur=".5s"
                 begin="4.6s"
                 fill="freeze"/>
      </g>

      <!-- Python -->
      <g opacity="0">
        <circle cx="610" cy="100" r="6"
                fill="#95A27D"
                filter="url(#glow)"/>

        <text x="610" y="85"
              fill="#B8C4A3">
          PYTHON
        </text>

        <animate attributeName="opacity"
                 from="0" to="1"
                 dur=".5s"
                 begin="4.7s"
                 fill="freeze"/>
      </g>

    </g>


    <!-- ================= FLOATING PARTICLES ================= -->

    <g fill="#B8C4A3" filter="url(#glow)">

      <circle cx="260" cy="125" r="2">
        <animate attributeName="cy"
                 values="125;115;125"
                 dur="2.5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="735" cy="120" r="2">
        <animate attributeName="cy"
                 values="120;108;120"
                 dur="2.2s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="350" cy="145" r="1.8">
        <animate attributeName="cy"
                 values="145;132;145"
                 dur="2s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="650" cy="145" r="1.8">
        <animate attributeName="cy"
                 values="145;132;145"
                 dur="2.4s"
                 repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- ================= GROUND ================= -->

    <path d="M150 430
             Q300 415 500 430
             Q700 415 850 430"

          fill="none"
          stroke="url(#ground)"
          stroke-width="2"/>


    <!-- ================= TERMINAL MESSAGE ================= -->

    <text x="500"
          y="458"
          text-anchor="middle"
          fill="#72805F"
          font-family="Courier New, monospace"
          font-size="12"
          letter-spacing="2">

      &gt; BUILDING IDEAS INTO SOMETHING REAL_

    </text>

  </g>

</svg>
