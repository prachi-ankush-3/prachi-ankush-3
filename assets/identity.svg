```svg
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 430"
     role="img"
     aria-label="Prachi Ankush developer profile">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#080B09"/>
      <stop offset="50%" stop-color="#10160F"/>
      <stop offset="100%" stop-color="#060806"/>
    </linearGradient>

    <!-- Main glow -->
    <radialGradient id="mainGlow"
                    cx="72%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#95A27D" stop-opacity=".14"/>
      <stop offset="55%" stop-color="#72805F" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#080B09" stop-opacity="0"/>
    </radialGradient>

    <!-- Line gradient -->
    <linearGradient id="line"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#3D4432" stop-opacity="0"/>
      <stop offset="50%" stop-color="#95A27D"/>
      <stop offset="100%" stop-color="#3D4432" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow"
            x="-100%" y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#95A27D"
            stroke-opacity=".045"
            stroke-width="1"/>

    </pattern>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200"
        height="430"
        rx="24"
        fill="url(#bg)"/>

  <rect width="1200"
        height="430"
        rx="24"
        fill="url(#grid)"/>

  <rect width="1200"
        height="430"
        rx="24"
        fill="url(#mainGlow)"/>


  <!-- ================================================= -->
  <!-- TOP ACCENT -->
