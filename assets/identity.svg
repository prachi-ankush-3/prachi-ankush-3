<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Digital identity terminal">
  <style>
    .p { font-family: "Courier New", Courier, monospace; }
    .dim { fill: #3D4432; font-size: 13px; }
    .cmd { fill: #95A27D; font-size: 13px; }
    .out { fill: #FFFFFF; font-size: 15px; }
    .miss { fill: #95A27D; font-size: 16px; letter-spacing: 2px; }
  </style>
  <rect width="720" height="340" fill="#0D1117"/>
  <line x1="24" y1="0" x2="24" y2="340" stroke="#3D4432" stroke-width="1"/>
  <circle cx="24" cy="28" r="3.5" fill="#95A27D">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text class="p dim" x="42" y="32">prachi@github:~$</text>
  <text class="p cmd" x="198" y="32">whoami</text>
  <text class="p out" x="42" y="58">Computer Engineering Student</text>
  <text class="p out" x="42" y="78">VIT Pune</text>
  <circle cx="24" cy="118" r="3.5" fill="#95A27D">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <text class="p dim" x="42" y="122">prachi@github:~$</text>
  <text class="p cmd" x="198" y="122">interests</text>
  <text class="p out" x="42" y="148">AI</text>
  <text class="p out" x="42" y="168">Software Engineering</text>
  <text class="p out" x="42" y="188">Web Development · Android · Cloud</text>
  <text class="p out" x="42" y="208">Problem Solving</text>
  <circle cx="24" cy="248" r="3.5" fill="#95A27D">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <text class="p dim" x="42" y="252">prachi@github:~$</text>
  <text class="p cmd" x="198" y="252">current_mission</text>
  <text class="p miss" x="42" y="286">BUILD  ’  LEARN  ’  SOLVE  ’  REPEAT</text>
  <rect x="42" y="310" width="8" height="16" fill="#95A27D">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="720" height="6" fill="#95A27D" opacity="0.12">
    <animate attributeName="y" values="0;334;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
