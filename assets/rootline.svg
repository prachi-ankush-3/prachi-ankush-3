<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 120"
     width="900"
     height="120"
     role="img"
     aria-label="Flying butterflies">

  <rect width="900" height="120" fill="#0D1117"/>

  <defs>

    <!-- Butterfly -->
    <g id="butterfly">

      <!-- left wing -->
      <path d="M0 0
               C-13 -15 -25 -12 -22 0
               C-20 9 -9 11 0 4Z"
            fill="#B8C99A"
            opacity=".9"/>

      <!-- right wing -->
      <path d="M0 0
               C13 -15 25 -12 22 0
               C20 9 9 11 0 4Z"
            fill="#D7E6BA"
            opacity=".9"/>

      <!-- body -->
      <ellipse cx="0" cy="3" rx="1.7" ry="7"
               fill="#E4EBCF"/>

      <!-- antenna -->
      <path d="M-1 -3 Q-5 -10 -7 -11
               M1 -3 Q5 -10 7 -11"
            fill="none"
            stroke="#B8C99A"
            stroke-width=".8"
            stroke-linecap="round"/>

      <!-- wing movement -->
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1,1; .72,1; 1,1"
        dur=".55s"
        repeatCount="indefinite"/>

    </g>

  </defs>


  <!-- soft flowing path -->
  <path
    d="M-40 70
       C120 25 190 100 320 58
       S520 25 650 67
       S790 105 940 48"
    fill="none"
    stroke="#95A27D"
    stroke-width="1"
    opacity=".18"/>


  <!-- ================= BUTTERFLY 1 ================= -->

  <g>

    <g transform="translate(80 65)">
      <use href="#butterfly"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
        80 65;
        180 35;
        290 70;
        410 42;
        530 60;
        650 30;
        790 65;
        940 40"
        dur="11s"
        repeatCount="indefinite"/>
    </g>

  </g>


  <!-- ================= BUTTERFLY 2 ================= -->

  <g>

    <g transform="translate(0 80) scale(.75)">

      <use href="#butterfly"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
        0 80;
        120 48;
        250 82;
        390 50;
        520 78;
        680 45;
        820 70;
        960 42"
        dur="13s"
        begin="2s"
        repeatCount="indefinite"/>

    </g>

  </g>


  <!-- ================= BUTTERFLY 3 ================= -->

  <g>

    <g transform="translate(0 45) scale(.55)">

      <use href="#butterfly"/>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
        0 45;
        130 65;
        260 35;
        400 62;
        540 38;
        690 60;
        830 35;
        960 55"
        dur="9s"
        begin="4s"
        repeatCount="indefinite"/>

    </g>

  </g>


  <!-- tiny floating particles -->

  <g fill="#D7E6BA">

    <circle cx="220" cy="30" r="1">
      <animate
        attributeName="cy"
        values="30;22;30"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="580" cy="88" r=".8">
      <animate
        attributeName="cy"
        values="88;78;88"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="25" r=".7">
      <animate
        attributeName="cy"
        values="25;18;25"
        dur="2.8s"
        repeatCount="indefinite"/>
    </circle>

  </g>

</svg>n