<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 100"
     width="900"
     height="100"
     role="img"
     aria-label="Flying butterflies">

  <rect width="900" height="100" fill="#0D1117"/>

  <!-- Soft flowing breeze -->
  <path
    d="M-30 65
       C100 35 170 88 290 58
       S470 30 590 60
       S780 85 930 45"
    fill="none"
    stroke="#95A27D"
    stroke-width="1"
    opacity="0.16"/>


  <!-- ================================================= -->
  <!-- BUTTERFLY 1 -->
  <!-- ================================================= -->

  <g>

    <!-- body -->
    <ellipse
      cx="0"
      cy="0"
      rx="2"
      ry="8"
      fill="#E4EBCF"/>

    <!-- left wing -->
    <path
      d="M-1 -1
         C-18 -20 -32 -13 -27 2
         C-24 12 -11 13 -1 5Z"
      fill="#B8C99A"
      opacity="0.9">

      <animateTransform
        attributeName="transform"
        type="scale"
        values="1 1;0.55 1;1 1"
        dur="0.55s"
        repeatCount="indefinite"/>

    </path>

    <!-- right wing -->
    <path
      d="M1 -1
         C18 -20 32 -13 27 2
         C24 12 11 13 1 5Z"
      fill="#D7E6BA"
      opacity="0.9">

      <animateTransform
        attributeName="transform"
        type="scale"
        values="1 1;0.55 1;1 1"
        dur="0.55s"
        repeatCount="indefinite"/>

    </path>

    <!-- antenna -->
    <path
      d="M-1 -6 Q-7 -14 -11 -15
         M1 -6 Q7 -14 11 -15"
      fill="none"
      stroke="#B8C99A"
      stroke-width="0.8"
      stroke-linecap="round"/>

    <!-- flight -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="
        -40 62;
        80 35;
        190 68;
        310 42;
        430 65;
        550 32;
        680 58;
        800 38;
        940 55"
      dur="12s"
      repeatCount="indefinite"/>

  </g>


  <!-- ================================================= -->
  <!-- BUTTERFLY 2 -->
  <!-- ================================================= -->

  <g>

    <!-- body -->
    <ellipse
      cx="0"
      cy="0"
      rx="1.5"
      ry="6"
      fill="#E4EBCF"/>

    <!-- left wing -->
    <path
      d="M-1 -1
         C-13 -15 -24 -10 -21 2
         C-19 10 -9 10 -1 4Z"
      fill="#95A27D"
      opacity="0.85">

      <animateTransform
        attributeName="transform"
        type="scale"
        values="1 1;0.5 1;1 1"
        dur="0.48s"
        repeatCount="indefinite"/>

    </path>

    <!-- right wing -->
    <path
      d="M1 -1
         C13 -15 24 -10 21 2
         C19 10 9 10 1 4Z"
      fill="#C4D6A0"
      opacity="0.85">

      <animateTransform
        attributeName="transform"
        type="scale"
        values="1 1;0.5 1;1 1"
        dur="0.48s"
        repeatCount="indefinite"/>

    </path>

    <!-- antenna -->
    <path
      d="M-1 -5 Q-5 -11 -8 -12
         M1 -5 Q5 -11 8 -12"
      fill="none"
      stroke="#95A27D"
      stroke-width="0.7"/>

    <!-- flight -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="
        -70 82;
        70 55;
        210 78;
        350 48;
        500 72;
        640 45;
        790 70;
        960 48"
      dur="15s"
      begin="2s"
      repeatCount="indefinite"/>

  </g>


  <!-- ================================================= -->
  <!-- BUTTERFLY 3 — smaller / distant -->
  <!-- ================================================= -->

  <g>

    <!-- body -->
    <ellipse
      cx="0"
      cy="0"
      rx="1"
      ry="5"
      fill="#E4EBCF"/>

    <!-- left wing -->
    <path
      d="M0 0
         C-10 -12 -18 -9 -16 1
         C-14 7 -7 8 0 4Z"
      fill="#AEBE91"
      opacity="0.65"/>

    <!-- right wing -->
    <path
      d="M0 0
         C10 -12 18 -9 16 1
         C14 7 7 8 0 4Z"
      fill="#D0DEB0"
      opacity="0.65"/>

    <!-- flight -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="
        -50 38;
        100 60;
        250 32;
        400 52;
        550 28;
        700 48;
        850 30;
        950 42"
      dur="10s"
      begin="4s"
      repeatCount="indefinite"/>

  </g>


  <!-- ================================================= -->
  <!-- FLOATING LIGHT PARTICLES -->
  <!-- ================================================= -->

  <g fill="#D7E6BA">

    <circle cx="180" cy="25" r="1">
      <animate
        attributeName="cy"
        values="25;18;25"
        dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="350" cy="78" r="0.8">
      <animate
        attributeName="cy"
        values="78;70;78"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="610" cy="20" r="0.8">
      <animate
        attributeName="cy"
        values="20;14;20"
        dur="2.7s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="76" r="1">
      <animate
        attributeName="cy"
        values="76;68;76"
        dur="3.2s"
        repeatCount="indefinite"/>
    </circle>

  </g>

</svg>