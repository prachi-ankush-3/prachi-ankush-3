<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="Terminal rain of developer commands">
  <defs>
    <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="1"/>
      <stop offset="12%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="88%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
    <filter id="rainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="220" fill="#0D1117"/>
  <style>
    .r { font-family: "Courier New", Courier, monospace; font-size: 12px; }
  </style>
  <g class="r">
    <g fill="#3D4432">
      <text x="28" y="0">git add .</text>
      <text x="28" y="22">git commit</text>
      <text x="28" y="44">git push</text>
      <text x="28" y="66">merge</text>
      <text x="28" y="88">deploy</text>
      <text x="28" y="110">build()</text>
      <text x="28" y="132">sudo</text>
      <text x="28" y="154">localhost</text>
      <text x="28" y="176">git add .</text>
      <text x="28" y="198">git push</text>
      <animateTransform attributeName="transform" type="translate" values="0 -200; 0 220" dur="9s" repeatCount="indefinite"/>
    </g>
    <g fill="#95A27D" filter="url(#rainGlow)">
      <text x="130" y="8">python</text>
      <text x="130" y="30">java</text>
      <text x="130" y="52">react</text>
      <text x="130" y="74">import</text>
      <text x="130" y="88">class</text>
      <text x="130" y="110">function</text>
