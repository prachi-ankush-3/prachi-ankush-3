<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 380"
     width="1200"
     height="380"
     role="img"
     aria-label="Prachi Ankush technology train travelling through a forest">

<defs>

  <!-- ================= BACKGROUND ================= -->

  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset="0.55" stop-color="#111A13"/>
    <stop offset="1" stop-color="#182319"/>
  </linearGradient>


  <!-- ================= TRAIN ================= -->

  <linearGradient id="trainBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4A553B"/>
    <stop offset="0.35" stop-color="#3D4432"/>
    <stop offset="1" stop-color="#20271E"/>
  </linearGradient>

  <linearGradient id="trainRoof" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#59664A"/>
    <stop offset="1" stop-color="#30382A"/>
  </linearGradient>


  <!-- ================= WINDOWS ================= -->

  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E4EBCF"/>
    <stop offset="0.4" stop-color="#B8C4A3"/>
    <stop offset="1" stop-color="#71805F"/>
  </linearGradient>


  <!-- ================= TRAIN GLOW ================= -->

  <filter id="trainGlow"
          x="-20%"
          y="-20%"
          width="140%"
          height="150%">

    <feGaussianBlur
      stdDeviation="2"
      result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>


  <!-- ================= TREE ================= -->

  <g id="tree">

    <rect x="-4"
          y="35"
          width="8"
          height="65"
          rx="2"
          fill="#29271E"/>

    <circle cx="0"
            cy="20"
            r="28"
            fill="#1B3020"/>

    <circle cx="-18"
            cy="35"
            r="22"
            fill="#233D27"/>

    <circle cx="18"
            cy="35"
            r="22"
            fill="#29472D"/>

    <circle cx="0"
            cy="5"
            r="20"
            fill="#315333"/>

  </g>


  <!-- ================= CLOUD ================= -->

  <g id="cloud"
     fill="#B8C4A3"
     opacity=".09">

    <circle cx="0"
            cy="15"
            r="18"/>

    <circle cx="22"
            cy="10"
            r="25"/>

    <circle cx="48"
            cy="17"
            r="18"/>

    <rect x="0"
          y="15"
          width="48"
          height="18"/>

  </g>

</defs>


<!-- ================================================= -->
<!-- SKY -->
<!-- ================================================= -->

<rect width="1200"
      height="380"
      fill="url(#sky)"/>


<!-- ================================================= -->
<!-- MOON / SOFT LIGHT -->
<!-- ================================================= -->

<circle cx="1030"
        cy="65"
        r="25"
        fill="#D7E6BA"
        opacity=".07"/>

<circle cx="1030"
        cy="65"
        r="18"
        fill="#E4EBCF"
        opacity=".05"/>


<!-- ================================================= -->
<!-- CLOUDS -->
<!-- ================================================= -->

<use href="#cloud"
     x="130"
     y="55">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;35 0;0 0"
    dur="14s"
    repeatCount="indefinite"/>

</use>


<use href="#cloud"
     x="600"
     y="40">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;-45 0;0 0"
    dur="17s"
    repeatCount="indefinite"/>

</use>


<use href="#cloud"
     x="950"
     y="75">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;30 0;0 0"
    dur="12s"
    repeatCount="indefinite"/>

</use>


<!-- ================================================= -->
<!-- DISTANT FOREST -->
<!-- ================================================= -->

<g opacity=".45">

  <use href="#tree"
       x="70"
       y="115"
       transform="scale(.8)"/>

  <use href="#tree"
       x="190"
       y="120"
       transform="scale(.65)"/>

  <use href="#tree"
       x="1000"
       y="115"
       transform="scale(.7)"/>

  <use href="#tree"
       x="1130"
       y="115"
       transform="scale(.85)"/>

</g>


<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<text x="600"
      y="42"
      text-anchor="middle"
      font-family="monospace"
      font-size="12"
      font-weight="bold"
      letter-spacing="5"
      fill="#B8C4A3">

  PRACHI'S TECH JOURNEY

</text>


<text x="600"
      y="61"
      text-anchor="middle"
      font-family="monospace"
      font-size="8"
      letter-spacing="2"
      fill="#6F805F"
      opacity=".9">

  BUILDING • LEARNING • EXPLORING

</text>


<!-- ================================================= -->
<!-- TRAIN -->
<!-- ================================================= -->

<g filter="url(#trainGlow)">

  <!-- TRAIN MOVEMENT -->

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-1100 0;
            -500 0;
            100 0;
            700 0;
            1300 0"
    keyTimes="0;
             .25;
             .5;
             .75;
             1"
    dur="18s"
    repeatCount="indefinite"/>


  <!-- ================================================= -->
  <!-- ENGINE -->
  <!-- ================================================= -->

  <g>

    <!-- smoke -->

    <circle cx="82"
            cy="108"
            r="9"
            fill="#B8C4A3"
            opacity=".12">

      <animate
        attributeName="cy"
        values="108;85;65"
        dur="3s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".05;.2;0"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="100"
            cy="90"
            r="6"
            fill="#D7E6BA"
            opacity=".08">

      <animate
        attributeName="cy"
        values="90;65;45"
        dur="3.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".05;.15;0"
        dur="3.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- chimney -->

    <rect x="70"
          y="118"
          width="27"
          height="32"
          rx="3"
          fill="#242C21"
          stroke="#95A27D"
          stroke-width="2"/>

    <rect x="64"
          y="111"
          width="39"
          height="8"
          rx="3"
          fill="#59664A"
          stroke="#95A27D"
          stroke-width="1"/>


    <!-- engine body -->

    <path d="
      M35 150
      H170
      V220
      H35
      Q20 220 20 205
      V165
      Q20 150 35 150Z"

      fill="url(#trainBody)"
      stroke="#95A27D"
      stroke-width="2"/>


    <!-- engine front -->

    <path d="
      M170 165
      H205
      L225 185
      L205 205
      H170Z"

      fill="#30382A"
      stroke="#95A27D"
      stroke-width="2"/>


    <!-- window -->

    <rect x="52"
          y="164"
          width="45"
          height="32"
          rx="5"
          fill="url(#window)"
          opacity=".9"/>


    <!-- window reflection -->

    <path d="M56 168 L65 168 L83 192 L74 192Z"
          fill="#FFFFFF"
          opacity=".16"/>


    <!-- headlight -->

    <circle cx="213"
            cy="185"
            r="8"
            fill="#D7E6BA">

      <animate
        attributeName="opacity"
        values=".35;1;.35"
        dur="1.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="r"
        values="7;9;7"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- wheels -->

    <g fill="#111711"
       stroke="#95A27D"
       stroke-width="2">

      <circle cx="65"
              cy="225"
              r="18"/>

      <circle cx="145"
              cy="225"
              r="18"/>

    </g>


    <g fill="#71805F">

      <circle cx="65"
              cy="225"
              r="5"/>

      <circle cx="145"
              cy="225"
              r="5"/>

    </g>


    <text x="125"
          y="207"
          text-anchor="middle"
          font-family="monospace"
          font-size="9"
          font-weight="bold"
          fill="#E4EBCF">

      CODE EXPRESS

    </text>

  </g>


  <!-- ================================================= -->
  <!-- CONNECTOR -->
  <!-- ================================================= -->

  <rect x="220"
        y="190"
        width="25"
        height="7"
        rx="3"
        fill="#71805F"/>


  <!-- ================================================= -->
  <!-- JAVA / PYTHON / CARRIAGE -->
  <!-- ================================================= -->

  <g>

    <rect x="245"
          y="145"
          width="190"
          height="75"
          rx="8"
          fill="url(#trainBody)"
          stroke="#95A27D"
          stroke-width="2"/>


    <rect x="235"
          y="137"
          width="210"
          height="11"
          rx="5"
          fill="url(#trainRoof)"
          stroke="#6F805F"
          stroke-width="1"/>


    <!-- windows -->

    <rect x="260"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>

    <rect x="305"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>

    <rect x="350"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>


    <!-- window reflections -->

    <g fill="#FFFFFF"
       opacity=".15">

      <path d="M263 161 L270 161 L288 183 L280 183Z"/>
      <path d="M308 161 L315 161 L333 183 L325 183Z"/>
      <path d="M353 161 L360 161 L378 183 L370 183Z"/>

    </g>


    <text x="340"
          y="205"
          text-anchor="middle"
          font-family="monospace"
          font-size="9"
          font-weight="bold"
          fill="#E4EBCF">

      JAVA · PYTHON · C++ · C

    </text>


    <!-- wheels -->

    <circle cx="280"
            cy="225"
            r="15"
            fill="#111711"
            stroke="#95A27D"
            stroke-width="2"/>

    <circle cx="400"
            cy="225"
            r="15"
            fill="#111711"
            stroke="#95A27D"
            stroke-width="2"/>

  </g>


  <!-- ================================================= -->
  <!-- CONNECTOR -->
  <!-- ================================================= -->

  <rect x="435"
        y="190"
        width="20"
        height="7"
        rx="3"
        fill="#71805F"/>


  <!-- ================================================= -->
  <!-- WEB CARRIAGE -->
  <!-- ================================================= -->

  <g>

    <rect x="455"
          y="145"
          width="190"
          height="75"
          rx="8"
          fill="url(#trainBody)"
          stroke="#95A27D"
          stroke-width="2"/>


    <rect x="445"
          y="137"
          width="210"
          height="11"
          rx="5"
          fill="url(#trainRoof)"
          stroke="#6F805F"
          stroke-width="1"/>


    <!-- windows -->

    <rect x="470"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>

    <rect x="515"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>

    <rect x="560"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>


    <g fill="#FFFFFF"
       opacity=".15">

      <path d="M473 161 L480 161 L498 183 L490 183Z"/>
      <path d="M518 161 L525 161 L543 183 L535 183Z"/>
      <path d="M563 161 L570 161 L588 183 L580 183Z"/>

    </g>


    <text x="550"
          y="205"
          text-anchor="middle"
          font-family="monospace"
          font-size="9"
          font-weight="bold"
          fill="#E4EBCF">

      REACT · JS · HTML · CSS · PHP

    </text>


    <!-- wheels -->

    <circle cx="490"
            cy="225"
            r="15"
            fill="#111711"
            stroke="#95A27D"
            stroke-width="2"/>

    <circle cx="610"
            cy="225"
            r="15"
            fill="#111711"
            stroke="#95A27D"
            stroke-width="2"/>

  </g>


  <!-- ================================================= -->
  <!-- CONNECTOR -->
  <!-- ================================================= -->

  <rect x="645"
        y="190"
        width="20"
        height="7"
        rx="3"
        fill="#71805F"/>


  <!-- ================================================= -->
  <!-- AI CARRIAGE -->
  <!-- ================================================= -->

  <g>

    <rect x="665"
          y="145"
          width="190"
          height="75"
          rx="8"
          fill="url(#trainBody)"
          stroke="#95A27D"
          stroke-width="2"/>


    <rect x="655"
          y="137"
          width="210"
          height="11"
          rx="5"
          fill="url(#trainRoof)"
          stroke="#6F805F"
          stroke-width="1"/>


    <!-- windows -->

    <rect x="680"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>

    <rect x="725"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>

    <rect x="770"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>


    <g fill="#FFFFFF"
       opacity=".15">

      <path d="M683 161 L690 161 L708 183 L700 183Z"/>
      <path d="M728 161 L735 161 L753 183 L745 183Z"/>
      <path d="M773 161 L780 161 L798 183 L790 183Z"/>

    </g>


    <text x="760"
          y="205"
          text-anchor="middle"
          font-family="monospace"
          font-size="8.5"
          font-weight="bold"
          fill="#E4EBCF">

      OPENCV · MEDIAPIPE · TENSORFLOW

    </text>


    <!-- wheels -->

    <circle cx="700"
            cy="225"
            r="15"
            fill="#111711"
            stroke="#95A27D"
            stroke-width="2"/>

    <circle cx="820"
            cy="225"
            r="15"
            fill="#111711"
            stroke="#95A27D"
            stroke-width="2"/>

  </g>


  <!-- ================================================= -->
  <!-- CONNECTOR -->
  <!-- ================================================= -->

  <rect x="855"
        y="190"
        width="20"
        height="7"
        rx="3"
        fill="#71805F"/>


  <!-- ================================================= -->
  <!-- MOBILE / CLOUD / TOOLS -->
  <!-- ================================================= -->

  <g>

    <rect x="875"
          y="145"
          width="220"
          height="75"
          rx="8"
          fill="url(#trainBody)"
          stroke="#95A27D"
          stroke-width="2"/>


    <rect x="865"
          y="137"
          width="240"
          height="11"
          rx="5"
          fill="url(#trainRoof)"
          stroke="#6F805F"
          stroke-width="1"/>


    <!-- windows -->

    <rect x="890"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>

    <rect x="935"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>

    <rect x="980"
          y="158"
          width="35"
          height="28"
          rx="4"
          fill="url(#window)"/>


    <g fill="#FFFFFF"
       opacity=".15">

      <path d="M893 161 L900 161 L918 183 L910 183Z"/>
      <path d="M938 161 L945 161 L963 183 L955 183Z"/>
      <path d="M983 161 L990 161 L1008 183 L1000 183Z"/>

    </g>


    <text x="985"
          y="204"
          text-anchor="middle"
          font-family="monospace"
          font-size="8"
          font-weight="bold"
          fill="#E4EBCF">

      ANDROID · AWS · LINUX · GIT · MYSQL

    </text>


    <!-- wheels -->

    <circle cx="910"
            cy="225"
            r="15"
            fill="#111711"
            stroke="#95A27D"
            stroke-width="2"/>

    <circle cx="1055"
            cy="225"
            r="15"
            fill="#111711"
            stroke="#95A27D"
            stroke-width="2"/>

  </g>

</g>


<!-- ================================================= -->
<!-- TRACK -->
<!-- ================================================= -->

<line x1="0"
      y1="242"
      x2="1200"
      y2="242"
      stroke="#95A27D"
      stroke-width="3"
      opacity=".55"/>


<line x1="0"
      y1="255"
      x2="1200"
      y2="255"
      stroke="#6F805F"
      stroke-width="2"
      opacity=".4"/>


<!-- ================================================= -->
<!-- RAILWAY SLEEPERS -->
<!-- ================================================= -->

<g stroke="#71805F"
   stroke-width="5"
   opacity=".3">

  <path d="
    M20 238V260
    M100 238V260
    M180 238V260
    M260 238V260
    M340 238V260
    M420 238V260
    M500 238V260
    M580 238V260
    M660 238V260
    M740 238V260
    M820 238V260
    M900 238V260
    M980 238V260
    M1060 238V260
    M1140 238V260"/>

</g>


<!-- ================================================= -->
<!-- FOREGROUND GRASS -->
<!-- ================================================= -->

<path d="
  M0 275
  Q100 255 200 275
  T400 275
  T600 275
  T800 275
  T1000 275
  T1200 275
  V380
  H0Z"

  fill="#0A100C"/>


<!-- ================================================= -->
<!-- FOREGROUND TREES -->
<!-- ================================================= -->

<g>

  <use href="#tree"
       x="35"
       y="265"
       transform="scale(1.25)"/>

  <use href="#tree"
       x="170"
       y="270"
       transform="scale(.9)"/>

  <use href="#tree"
       x="1100"
       y="260"
       transform="scale(1.2)"/>

  <use href="#tree"
       x="1180"
       y="270"
       transform="scale(.9)"/>

</g>


<!-- ================================================= -->
<!-- FIREFLIES -->
<!-- ================================================= -->

<g fill="#D7E6BA">

  <circle cx="120"
          cy="280"
          r="2">

    <animate
      attributeName="opacity"
      values=".1;1;.1"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="320"
          cy="300"
          r="1.5">

    <animate
      attributeName="opacity"
      values=".1;1;.1"
      dur="2.8s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="900"
          cy="290"
          r="2">

    <animate
      attributeName="opacity"
      values=".1;1;.1"
      dur="2.3s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="1030"
          cy="315"
          r="1.2">

    <animate
      attributeName="opacity"
      values=".1;1;.1"
      dur="3.1s"
      repeatCount="indefinite"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<text x="600"
      y="335"
      text-anchor="middle"
      font-family="monospace"
      font-size="10"
      font-weight="bold"
