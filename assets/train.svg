<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 380"
     width="1200"
     height="380"
     role="img"
     aria-label="Prachi Ankush technology train travelling through a forest">

<defs>

  <!-- Sky gradient -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#08140D"/>
    <stop offset="1" stop-color="#13281A"/>
  </linearGradient>

  <!-- Train body -->
  <linearGradient id="trainBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#203B25"/>
    <stop offset="1" stop-color="#0B1B10"/>
  </linearGradient>

  <!-- Window glow -->
  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D7E6BA"/>
    <stop offset="1" stop-color="#70865B"/>
  </linearGradient>

  <!-- Tree -->
  <g id="tree">

    <rect x="-4" y="35" width="8" height="65"
          fill="#352D1D"/>

    <circle cx="0" cy="20" r="28"
            fill="#18351F"/>

    <circle cx="-18" cy="35" r="22"
            fill="#214528"/>

    <circle cx="18" cy="35" r="22"
            fill="#214528"/>

    <circle cx="0" cy="5" r="20"
            fill="#285331"/>

  </g>

  <!-- Cloud -->
  <g id="cloud" fill="#B8C99A" opacity=".12">

    <circle cx="0" cy="15" r="18"/>
    <circle cx="22" cy="10" r="25"/>
    <circle cx="48" cy="17" r="18"/>
    <rect x="0" y="15" width="48" height="18"/>

  </g>

</defs>


<!-- ================================================= -->
<!-- SKY -->
<!-- ================================================= -->

<rect width="1200" height="380" fill="url(#sky)"/>


<!-- ================================================= -->
<!-- CLOUDS -->
<!-- ================================================= -->

<use href="#cloud" x="150" y="55">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;40 0;0 0"
    dur="12s"
    repeatCount="indefinite"/>

</use>

<use href="#cloud" x="650" y="45">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;-50 0;0 0"
    dur="15s"
    repeatCount="indefinite"/>

</use>

<use href="#cloud" x="980" y="75">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;35 0;0 0"
    dur="13s"
    repeatCount="indefinite"/>

</use>


<!-- ================================================= -->
<!-- DISTANT FOREST -->
<!-- ================================================= -->

<g opacity=".55">

  <use href="#tree" x="70" y="115" transform="scale(.8)"/>
  <use href="#tree" x="180" y="125" transform="scale(.65)"/>
  <use href="#tree" x="1040" y="110" transform="scale(.75)"/>
  <use href="#tree" x="1140" y="120" transform="scale(.9)"/>

</g>


<!-- ================================================= -->
<!-- MOVING FOREGROUND FOREST -->
<!-- ================================================= -->

<g>

  <g>

    <use href="#tree" x="20" y="185" transform="scale(1.1)"/>
    <use href="#tree" x="160" y="175"/>
    <use href="#tree" x="1080" y="180" transform="scale(1.1)"/>
    <use href="#tree" x="1180" y="175"/>

  </g>

</g>


<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<text x="600"
      y="45"
      text-anchor="middle"
      font-family="monospace"
      font-size="12"
      letter-spacing="5"
      fill="#B8C99A">

  PRACHI'S TECH JOURNEY

</text>


<!-- ================================================= -->
<!-- TRAIN -->
<!-- ================================================= -->

<g>

  <!-- LOOPING TRAIN -->

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-1100 0;0 0;1100 0"
    keyTimes="0;.5;1"
    dur="16s"
    repeatCount="indefinite"/>


  <!-- ================= ENGINE ================= -->

  <g>

    <!-- chimney smoke -->

    <circle cx="85" cy="115" r="9"
            fill="#B8C99A"
            opacity=".18">

      <animate
        attributeName="cy"
        values="115;90;115"
        dur="2.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".1;.3;.1"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="100" cy="95" r="6"
            fill="#B8C99A"
            opacity=".12">

      <animate
        attributeName="cy"
        values="95;70;95"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <!-- chimney -->

    <rect x="72" y="118"
          width="25"
          height="32"
          fill="#14291A"
          stroke="#6F8F55"
          stroke-width="2"/>

    <rect x="66" y="112"
          width="37"
          height="8"
          rx="3"
          fill="#6F8F55"/>


    <!-- engine -->

    <path d="M35 150
             H170
             V220
             H35
             Q20 220 20 205
             V165
             Q20 150 35 150Z"
          fill="url(#trainBody)"
          stroke="#95A27D"
          stroke-width="2"/>


    <!-- front -->

    <path d="M170 165
             H205
             L225 185
             L205 205
             H170Z"
          fill="#18341F"
          stroke="#95A27D"
          stroke-width="2"/>


    <!-- engine window -->

    <rect x="55" y="165"
          width="42"
          height="30"
          rx="4"
          fill="url(#window)"
          opacity=".85"/>


    <!-- headlight -->

    <circle cx="213"
            cy="184"
            r="7"
            fill="#D7E6BA">

      <animate
        attributeName="opacity"
        values=".4;1;.4"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- engine wheels -->

    <g fill="#08140D"
       stroke="#95A27D"
       stroke-width="2">

      <circle cx="65" cy="225" r="18"/>
      <circle cx="145" cy="225" r="18"/>

    </g>

    <g fill="#6F8F55">

      <circle cx="65" cy="225" r="5"/>
      <circle cx="145" cy="225" r="5"/>

    </g>


    <text x="125"
          y="207"
          text-anchor="middle"
          font-family="monospace"
          font-size="9"
          fill="#B8C99A">

      CODE EXPRESS

    </text>

  </g>


  <!-- ================================================= -->
  <!-- CONNECTOR -->
  <!-- ================================================= -->

  <rect x="220"
        y="190"
        width="25"
        height="7"
        fill="#6F8F55"/>


  <!-- ================================================= -->
  <!-- CORE CARRIAGE -->
  <!-- ================================================= -->

  <g>

    <rect x="245"
          y="145"
          width="190"
          height="75"
          rx="8"
          fill="url(#trainBody)"
          stroke="#6F8F55"
          stroke-width="2"/>


    <!-- roof -->

    <rect x="235"
          y="138"
          width="210"
          height="10"
          rx="5"
          fill="#315333"/>


    <!-- windows -->

    <rect x="260" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>

    <rect x="305" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>

    <rect x="350" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>


    <text x="340"
          y="205"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          fill="#E4EBCF">

      JAVA · PYTHON · C++ · C

    </text>


    <!-- wheels -->

    <circle cx="280" cy="225"
            r="15"
            fill="#08140D"
            stroke="#95A27D"/>

    <circle cx="400" cy="225"
            r="15"
            fill="#08140D"
            stroke="#95A27D"/>

  </g>


  <!-- connector -->

  <rect x="435"
        y="190"
        width="20"
        height="7"
        fill="#6F8F55"/>


  <!-- ================================================= -->
  <!-- WEB CARRIAGE -->
  <!-- ================================================= -->

  <g>

    <rect x="455"
          y="145"
          width="190"
          height="75"
          rx="8"
          fill="url(#trainBody)"
          stroke="#6F8F55"
          stroke-width="2"/>

    <rect x="445"
          y="138"
          width="210"
          height="10"
          rx="5"
          fill="#315333"/>


    <rect x="470" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>

    <rect x="515" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>

    <rect x="560" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>


    <text x="550"
          y="205"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          fill="#E4EBCF">

      REACT · JS · HTML · CSS · PHP

    </text>


    <circle cx="490" cy="225"
            r="15"
            fill="#08140D"
            stroke="#95A27D"/>

    <circle cx="610" cy="225"
            r="15"
            fill="#08140D"
            stroke="#95A27D"/>

  </g>


  <!-- connector -->

  <rect x="645"
        y="190"
        width="20"
        height="7"
        fill="#6F8F55"/>


  <!-- ================================================= -->
  <!-- AI CARRIAGE -->
  <!-- ================================================= -->

  <g>

    <rect x="665"
          y="145"
          width="190"
          height="75"
          rx="8"
          fill="url(#trainBody)"
          stroke="#6F8F55"
          stroke-width="2"/>

    <rect x="655"
          y="138"
          width="210"
          height="10"
          rx="5"
          fill="#315333"/>


    <rect x="680" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>

    <rect x="725" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>

    <rect x="770" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>


    <text x="760"
          y="205"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          fill="#E4EBCF">

      OPENCV · MEDIAPIPE · TENSORFLOW

    </text>


    <circle cx="700" cy="225"
            r="15"
            fill="#08140D"
            stroke="#95A27D"/>

    <circle cx="820" cy="225"
            r="15"
            fill="#08140D"
            stroke="#95A27D"/>

  </g>


  <!-- connector -->

  <rect x="855"
        y="190"
        width="20"
        height="7"
        fill="#6F8F55"/>


  <!-- ================================================= -->
  <!-- MOBILE + CLOUD -->
  <!-- ================================================= -->

  <g>

    <rect x="875"
          y="145"
          width="220"
          height="75"
          rx="8"
          fill="url(#trainBody)"
          stroke="#6F8F55"
          stroke-width="2"/>

    <rect x="865"
          y="138"
          width="240"
          height="10"
          rx="5"
          fill="#315333"/>


    <rect x="890" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>

    <rect x="935" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>

    <rect x="980" y="158"
          width="35" height="28"
          rx="3"
          fill="url(#window)"/>


    <text x="985"
          y="204"
          text-anchor="middle"
          font-family="monospace"
          font-size="9"
          fill="#E4EBCF">

      ANDROID · AWS · LINUX · GIT · GITHUB · MYSQL

    </text>


    <circle cx="910" cy="225"
            r="15"
            fill="#08140D"
            stroke="#95A27D"/>

    <circle cx="1055" cy="225"
            r="15"
            fill="#08140D"
            stroke="#95A27D"/>

  </g>

</g>


<!-- ================================================= -->
<!-- TRACK -->
<!-- ================================================= -->

<line x1="0" y1="242"
      x2="1200" y2="242"
      stroke="#95A27D"
      stroke-width="3"
      opacity=".5"/>

<line x1="0" y1="255"
      x2="1200" y2="255"
      stroke="#6F8F55"
      stroke-width="2"
      opacity=".3"/>


<!-- railway sleepers -->

<g stroke="#6F8F55"
   stroke-width="5"
   opacity=".25">

  <path d="
  M20 238V260
  M100 238V260
  M180 238V260
  M260 238V260
  M340 238V260
  M420 238V260
  M500 238V260
  M580 238V260
  M660 238V260
  M740 238V260
  M820 238V260
  M900 238V260
  M980 238V260
  M1060 238V260
  M1140 238V260"/>

</g>


<!-- ================================================= -->
<!-- FOREGROUND GRASS -->
<!-- ================================================= -->

<path d="
M0 275
Q100 255 200 275
T400 275
T600 275
T800 275
T1000 275
T1200 275
V380 H0Z"
fill="#08140D"/>


<!-- ================================================= -->
<!-- FOREGROUND TREES -->
<!-- ================================================= -->

<g>

  <use href="#tree" x="35" y="265" transform="scale(1.25)"/>
  <use href="#tree" x="170" y="270" transform="scale(.9)"/>
  <use href="#tree" x="1100" y="260" transform="scale(1.2)"/>
  <use href="#tree" x="1180" y="270" transform="scale(.9)"/>

</g>


<!-- ================================================= -->
<!-- FIREFLIES -->
<!-- ================================================= -->

<g fill="#D7E6BA">

  <circle cx="120" cy="280" r="2">
    <animate attributeName="opacity"
             values=".1;1;.1"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="320" cy="300" r="1.5">
    <animate attributeName="opacity"
             values=".1;1;.1"
             dur="2.8s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="900" cy="290" r="2">
    <animate attributeName="opacity"
             values=".1;1;.1"
             dur="2.3s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<text x="600"
      y="335"
      text-anchor="middle"
      font-family="monospace"
      font-size="10"
      letter-spacing="4"
      fill="#6F8F55">

  BUILD · LEARN · EXPLORE · REPEAT

</text>

</svg>