<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="430"
     viewBox="0 0 900 430"
     role="img"
     aria-label="Prachi Ankush achievement dashboard">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0D1117"/>
    <stop offset="50%" stop-color="#111A13"/>
    <stop offset="100%" stop-color="#0D1117"/>
  </linearGradient>

  <!-- Cards -->
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#18241A"/>
    <stop offset="100%" stop-color="#101610"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur
      stdDeviation="4"
      result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>

  <!-- Soft glow -->
  <radialGradient id="orb">
    <stop offset="0%" stop-color="#95A27D" stop-opacity=".22"/>
    <stop offset="100%" stop-color="#95A27D" stop-opacity="0"/>
  </radialGradient>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="900"
      height="430"
      rx="22"
      fill="url(#bg)"/>


<!-- ambient orbs -->

<circle cx="120"
        cy="80"
        r="100"
        fill="url(#orb)"
        opacity=".35">

  <animate
    attributeName="opacity"
    values=".15;.35;.15"
    dur="5s"
    repeatCount="indefinite"/>

</circle>

<circle cx="790"
        cy="350"
        r="130"
        fill="url(#orb)"
        opacity=".25">

  <animate
    attributeName="opacity"
    values=".1;.3;.1"
    dur="6s"
    repeatCount="indefinite"/>

</circle>


<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<text x="50"
      y="55"
      font-family="monospace"
      font-size="13"
      letter-spacing="5"
      fill="#72805F">

ACHIEVEMENT SYSTEM

</text>

<text x="850"
      y="55"
      text-anchor="end"
      font-family="monospace"
      font-size="11"
      letter-spacing="2"
      fill="#95A27D">

● ALL SYSTEMS ACTIVE

</text>

<path d="M50 75 H850"
      stroke="#263021"
      stroke-width="1"/>


<!-- ================================================= -->
<!-- ACHIEVEMENT 01 -->
<!-- ================================================= -->

<g>

  <rect x="50"
        y="105"
        width="385"
        height="125"
        rx="18"
        fill="url(#card)"
        stroke="#3D4432"
        stroke-width="1.5"/>

  <!-- animated corner -->

  <path d="M50 135
           Q50 105 80 105
           H135"
        fill="none"
        stroke="#95A27D"
        stroke-width="2"/>

  <!-- icon -->

  <circle cx="92"
          cy="165"
          r="27"
          fill="#0D1117"
          stroke="#95A27D"
          stroke-width="2"
          filter="url(#glow)"/>

  <text x="92"
        y="173"
        text-anchor="middle"
        font-family="monospace"
        font-size="22"
        fill="#D7E6BA">

⌘

  </text>

  <!-- text -->

  <text x="135"
        y="145"
        font-family="monospace"
        font-size="10"
        letter-spacing="2"
        fill="#72805F">

01 // PROBLEM SOLVER

  </text>

  <text x="135"
        y="175"
        font-family="monospace"
        font-size="21"
        font-weight="bold"
        fill="#E4EBCF">

200+

  </text>

  <text x="190"
        y="175"
        font-family="monospace"
        font-size="12"
        fill="#95A27D">

LEETCODE

  </text>

  <text x="135"
        y="200"
        font-family="monospace"
        font-size="10"
        fill="#72805F">

SOLVING • LEARNING • REPEATING

  </text>

  <!-- pulse -->

  <circle cx="92"
          cy="165"
          r="34"
          fill="none"
          stroke="#95A27D"
          stroke-width="1"
          opacity=".25">

    <animate
      attributeName="r"
      values="27;38;27"
      dur="3s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values=".35;0;.35"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- ACHIEVEMENT 02 -->
<!-- ================================================= -->

<g>

  <rect x="465"
        y="105"
        width="385"
        height="125"
        rx="18"
        fill="url(#card)"
        stroke="#3D4432"
        stroke-width="1.5"/>

  <path d="M465 135
           Q465 105 495 105
           H550"
        fill="none"
        stroke="#95A27D"
        stroke-width="2"/>

  <!-- cloud icon -->

  <circle cx="507"
          cy="165"
          r="27"
          fill="#0D1117"
          stroke="#95A27D"
          stroke-width="2"/>

  <text x="507"
        y="172"
        text-anchor="middle"
        font-family="monospace"
        font-size="19"
        fill="#D7E6BA">

☁

  </text>

  <text x="550"
        y="145"
        font-family="monospace"
        font-size="10"
        letter-spacing="2"
        fill="#72805F">

02 // CLOUD EXPLORER

  </text>

  <text x="550"
        y="175"
        font-family="monospace"
        font-size="19"
        font-weight="bold"
        fill="#E4EBCF">

AWS

  </text>

  <text x="600"
        y="175"
        font-family="monospace"
        font-size="12"
        fill="#95A27D">

SKILL BUILDER

  </text>

  <text x="550"
        y="200"
        font-family="monospace"
        font-size="10"
        fill="#72805F">

CLOUD • NETWORKING • LINUX

  </text>

  <!-- floating dot -->

  <circle cx="800"
          cy="130"
          r="3"
          fill="#B8C99A"
          filter="url(#glow)">

    <animate
      attributeName="cy"
      values="130;145;130"
      dur="2.5s"
      repeatCount="indefinite"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- ACHIEVEMENT 03 -->
<!-- ================================================= -->

<g>

  <rect x="50"
        y="255"
        width="385"
        height="125"
        rx="18"
        fill="url(#card)"
        stroke="#3D4432"
        stroke-width="1.5"/>

  <path d="M50 285
           Q50 255 80 255
           H135"
        fill="none"
        stroke="#95A27D"
        stroke-width="2"/>

  <!-- mobile icon -->

  <circle cx="92"
          cy="315"
          r="27"
          fill="#0D1117"
          stroke="#95A27D"
          stroke-width="2"/>

  <rect x="83"
        y="299"
        width="18"
        height="32"
        rx="3"
        fill="none"
        stroke="#D7E6BA"
        stroke-width="2"/>

  <circle cx="92"
          cy="326"
