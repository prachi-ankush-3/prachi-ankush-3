          fill="#D7E6BA"/>

  <text x="135"
        y="295"
        font-family="monospace"
        font-size="10"
        letter-spacing="2"
        fill="#72805F">

03 // ANDROID BUILDER

  </text>

  <text x="135"
        y="325"
        font-family="monospace"
        font-size="17"
        font-weight="bold"
        fill="#E4EBCF">

ANDROID

  </text>

  <text x="135"
        y="350"
        font-family="monospace"
        font-size="10"
        fill="#72805F">

JAVA • XML • APPLICATIONS

  </text>

  <!-- progress -->

  <rect x="135"
        y="365"
        width="250"
        height="3"
        rx="2"
        fill="#263021"/>

  <rect x="135"
        y="365"
        width="175"
        height="3"
        rx="2"
        fill="#95A27D">

    <animate
      attributeName="width"
      values="150;220;175"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- ACHIEVEMENT 04 -->
<!-- ================================================= -->

<g>

  <rect x="465"
        y="255"
        width="385"
        height="125"
        rx="18"
        fill="url(#card)"
        stroke="#3D4432"
        stroke-width="1.5"/>

  <path d="M465 285
           Q465 255 495 255
           H550"
        fill="none"
        stroke="#95A27D"
        stroke-width="2"/>

  <!-- research icon -->

  <circle cx="507"
          cy="315"
          r="27"
          fill="#0D1117"
          stroke="#95A27D"
          stroke-width="2"/>

  <text x="507"
        y="323"
        text-anchor="middle"
        font-family="monospace"
        font-size="19"
        fill="#D7E6BA">

✦

  </text>

  <text x="550"
        y="295"
        font-family="monospace"
        font-size="10"
        letter-spacing="2"
        fill="#72805F">

04 // RESEARCHER

  </text>

  <text x="550"
        y="325"
        font-family="monospace"
        font-size="17"
        font-weight="bold"
        fill="#E4EBCF">

SPRINGER

  </text>

  <text x="550"
        y="350"
        font-family="monospace"
        font-size="10"
        fill="#95A27D">

SCOPUS INDEXED

  </text>

  <text x="550"
        y="370"
        font-family="monospace"
        font-size="9"
        fill="#72805F">

BUILD • RESEARCH • PUBLISH

  </text>

  <!-- sparkle -->

  <circle cx="815"
          cy="285"
          r="2"
          fill="#D7E6BA"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="1.8s"
      repeatCount="indefinite"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<path d="M50 405 H850"
      stroke="#263021"
      stroke-width="1"/>

<circle cx="450"
        cy="405"
        r="3"
        fill="#95A27D"
        filter="url(#glow)">

  <animate
    attributeName="r"
    values="2;4;2"
    dur="2s"
    repeatCount="indefinite"/>

</circle>


</svg>