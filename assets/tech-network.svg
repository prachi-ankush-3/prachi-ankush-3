<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" role="img" aria-label="Tech DNA network lines">
  <rect width="860" height="160" fill="#0D1117"/>
  <g fill="none" stroke="#3D4432" stroke-width="1">
    <path d="M80 80 H780"/>
    <circle cx="80" cy="80" r="6"/>
    <circle cx="220" cy="80" r="6"/>
    <circle cx="360" cy="80" r="6"/>
    <circle cx="500" cy="80" r="6"/>
    <circle cx="640" cy="80" r="6"/>
    <circle cx="780" cy="80" r="6"/>
    <path d="M220 80 C220 40 360 40 360 80"/>
    <path d="M500 80 C500 120 640 120 640 80"/>
  </g>
  <g fill="#95A27D">
    <circle cx="80" cy="80" r="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="80" r="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="80" r="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="80" r="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="80" r="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="80" r="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="Courier New, monospace" font-size="11" fill="#72805F" text-anchor="middle">
    <text x="80" y="112">CORE</text>
    <text x="220" y="112">WEB</text>
    <text x="360" y="112">AI / VISION</text>
    <text x="500" y="112">MOBILE</text>
    <text x="640" y="112">CLOUD</text>
    <text x="780" y="112">TOOLS</text>
  </g>
  <circle cx="80" cy="80" r="2" fill="#FFFFFF">
    <animate attributeName="cx" values="80;780;80" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
