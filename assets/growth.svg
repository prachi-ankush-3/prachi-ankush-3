<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260">

  <rect width="900" height="260" rx="18" fill="#0D1117"/>

  <!-- subtle stars -->
  <g fill="#95A27D" opacity=".45">
    <circle cx="95" cy="55" r="2"/>
    <circle cx="215" cy="80" r="1.5"/>
    <circle cx="315" cy="42" r="2"/>
    <circle cx="510" cy="65" r="1.5"/>
    <circle cx="590" cy="35" r="2"/>
    <circle cx="810" cy="65" r="2"/>
  </g>

  <!-- ground -->
  <path
    d="M70 215 Q450 198 830 215"
    fill="none"
    stroke="#263021"
    stroke-width="2"
  />

  <!-- growth path -->
  <path
    d="M110 215
       C210 195 290 205 390 185
       C500 165 570 185 690 155"
    fill="none"
    stroke="#95A27D"
    stroke-width="2"
    stroke-dasharray="5 8"
    opacity=".65"
  />

  <!-- SMALL TREE -->
  <g>

    <!-- trunk -->
    <rect
      x="174"
      y="185"
      width="9"
      height="30"
      rx="3"
      fill="#6B7658"
    />

    <!-- leaves -->
    <circle cx="178" cy="164" r="27" fill="#59664A"/>
    <circle cx="155" cy="177" r="18" fill="#657255"/>
    <circle cx="201" cy="177" r="19" fill="#657255"/>
    <circle cx="178" cy="145" r="20" fill="#748263"/>

  </g>

  <!-- MEDIUM TREE -->
  <g>

    <!-- trunk -->
    <rect
      x="422"
      y="160"
      width="11"
      height="55"
      rx="3"
      fill="#7D8968"
    />

    <!-- leaves -->
    <circle cx="427" cy="143" r="43" fill="#657255"/>
    <circle cx="393" cy="160" r="29" fill="#71805E"/>
    <circle cx="462" cy="160" r="30" fill="#71805E"/>
    <circle cx="427" cy="111" r="34" fill="#7C8A68"/>
    <circle cx="403" cy="126" r="23" fill="#82906D"/>
    <circle cx="450" cy="126" r="23" fill="#82906D"/>

  </g>

  <!-- BIG TREE -->
  <g>

    <!-- trunk -->
    <rect
      x="697"
      y="145"
      width="14"
      height="70"
      rx="4"
      fill="#95A27D"
    />

    <!-- branches -->
    <path
      d="M704 170 L668 135
         M706 163 L741 130"
      stroke="#95A27D"
      stroke-width="7"
      stroke-linecap="round"
      fill="none"
    />

    <!-- crown -->
    <circle cx="704" cy="105" r="55" fill="#71805E"/>
    <circle cx="661" cy="125" r="37" fill="#7C8A68"/>
    <circle cx="746" cy="125" r="38" fill="#7C8A68"/>
    <circle cx="704" cy="65" r="43" fill="#82906D"/>
    <circle cx="674" cy="76" r="30" fill="#8D9A76"/>
    <circle cx="734" cy="78" r="31" fill="#8D9A76"/>
    <circle cx="704" cy="35" r="25" fill="#95A27D"/>

  </g>

  <!-- labels -->
  <g
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    letter-spacing="2"
    text-anchor="middle"
  >

    <text x="178" y="240" fill="#657255">
      START
    </text>

    <text x="427" y="240" fill="#7D8968">
      GROWING
    </text>

    <text x="704" y="240" fill="#B8C4A3">
      BUILDING
    </text>

  </g>

</svg>