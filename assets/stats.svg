<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 168" role="img" aria-label="System readout statistics">
  <style>
    .n { font-family: "Trebuchet MS", "Segoe UI", sans-serif; font-size: 52px; font-weight: 700; fill: #FFFFFF; }
    .l { font-family: "Courier New", Courier, monospace; font-size: 12px; fill: #95A27D; letter-spacing: 3px; }
  </style>
  <rect width="900" height="168" fill="#0D1117"/>
  <line x1="40" y1="128" x2="860" y2="128" stroke="#3D4432" stroke-width="1"/>
  <line x1="40" y1="128" x2="860" y2="128" stroke="#95A27D" stroke-width="1" stroke-dasharray="6 14">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="130" cy="128" r="4" fill="#95A27D">
    <animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="128" r="4" fill="#95A27D">
    <animate attributeName="r" values="3;6;3" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="128" r="4" fill="#95A27D">
    <animate attributeName="r" values="3;6;3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="128" r="4" fill="#95A27D">
    <animate attributeName="r" values="3;6;3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text class="n" x="130" y="78" text-anchor="middle">200+</text>
  <text class="l" x="130" y="152" text-anchor="middle">LEETCODE</text>
  <text class="n" x="340" y="78" text-anchor="middle">9.55</text>
  <text class="l" x="340" y="152" text-anchor="middle">CGPA</text>
  <text class="n" x="550" y="78" text-anchor="middle">2028</text>
  <text class="l" x="550" y="152" text-anchor="middle">GRADUATION</text>
  <text class="n" x="760" y="78" text-anchor="middle">AWS</text>
  <text class="l" x="760" y="152" text-anchor="middle">CLOUD</text>
  <circle cx="70" cy="36" r="1.4" fill="#95A27D">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="44" r="1.4" fill="#95A27D">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="455" cy="22" r="1.2" fill="#3D4432"/>
</svg>
