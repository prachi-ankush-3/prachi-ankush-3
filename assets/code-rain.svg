<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 92" role="img" aria-label="Code rain">
  <style>
    .c { font-family: "Courier New", Courier, monospace; font-size: 11px; fill: #95A27D; }
  </style>
  <rect width="900" height="92" fill="#0D1117"/>
