<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="760"
     viewBox="0 0 1200 760"
     role="img"
     aria-label="Prachi Ankush project universe">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0B120D"/>
    <stop offset="50%" stop-color="#101A12"/>
    <stop offset="100%" stop-color="#0B120D"/>
  </linearGradient>

  <!-- CARD -->
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1A291C"/>
    <stop offset="45%" stop-color="#142017"/>
    <stop offset="100%" stop-color="#0D1510"/>
  </linearGradient>

  <!-- GLOW -->
  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur stdDeviation="3" result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>

  <!-- BUTTERFLY -->
  <g id="butterfly">

    <ellipse cx="-7"
             cy="-1"
             rx="7"
             ry="11"
             fill="#B8C99A"
             opacity=".9"/>

    <ellipse cx="7"
             cy="-1"
             rx="7"
             ry="11"
             fill="#D7E6BA"
             opacity=".9"/>

    <ellipse cx="0"
             cy="2"
             rx="2"
             ry="9"
             fill="#72805F"/>

    <path d="M-1 -4
             Q-6 -12 -10 -14"
          fill="none"
          stroke="#B8C99A"
          stroke-width="1"
          stroke-linecap="round"/>

    <path d="M1 -4
             Q6 -12 10 -14"
          fill="none"
          stroke="#B8C99A"
          stroke-width="1"
          stroke-linecap="round"/>

    <animateTransform
      attributeName="transform"
      type="scale"
      values="1,1;0.58,1;1,1"
      dur="0.6s"
      repeatCount="indefinite"/>

  </g>

</defs>


<!-- BACKGROUND -->

<rect width="1200"
      height="760"
      rx="22"
      fill="url(#bg)"/>


<!-- ATMOSPHERE -->

<circle cx="100"
        cy="150"
        r="130"
        fill="#95A27D"
        opacity=".025"/>

<circle cx="1100"
        cy="600"
        r="170"
        fill="#95A27D"
