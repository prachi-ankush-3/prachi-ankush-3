        width="530"
        height="260"
        rx="18"
        fill="url(#card)"
        stroke="#3D4432"
        stroke-width="1.5"/>

  <!-- corner -->
  <path d="M50 135 Q50 100 85 100 H140"
        fill="none"
        stroke="#95A27D"
        stroke-width="2"/>

  <!-- number -->
  <text x="80"
        y="145"
        font-family="monospace"
        font-size="12"
        fill="#72805F">
    01
  </text>

  <!-- status -->
