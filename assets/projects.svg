        y="145"
        text-anchor="end"
        font-family="monospace"
        font-size="11"
        fill="#95A27D">
    ● BUILDING
  </text>

  <!-- title -->
  <text x="80"
        y="185"
        font-family="monospace"
        font-size="25"
        font-weight="bold"
        fill="#E4EBCF">
    EngiSummary
  </text>

  <text x="80"
        y="215"
        font-family="monospace"
        font-size="13"
        fill="#95A27D">
    Engineering Drawing Intelligence
  </text>

  <text x="80"
        y="250"
        font-family="monospace"
        font-size="12"
        fill="#72805F">
    React · Python · AI
  </text>

  <!-- repo button -->
  <rect x="80"
        y="285"
        width="145"
        height="38"
        rx="19"
        fill="#263021"
        stroke="#95A27D"
        stroke-width="1"/>

  <text x="152"
        y="309"
        text-anchor="middle"
        font-family="monospace"
        font-size="11"
        fill="#D7E6BA">
    VIEW PROJECT →
  </text>

  <!-- butterfly -->
  <g>

    <use href="#butterfly"
         transform="translate(535 325) scale(.65)"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; -30 -180; -250 -210; -420 -80; -350 110; -100 170; 0 0"
      dur="10s"
      repeatCount="indefinite"/>

  </g>

</g>


