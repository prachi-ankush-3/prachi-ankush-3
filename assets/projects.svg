```svg
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="720"
     viewBox="0 0 1200 720">

<rect width="1200" height="720" rx="20" fill="#0D1117"/>

<defs>

  <!-- Card gradient -->
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#172119"/>
    <stop offset="100%" stop-color="#0D1117"/>
  </linearGradient>

  <!-- Green glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Butterfly -->
  <g id="butterfly">

    <ellipse cx="-6" cy="0"
             rx="7" ry="11"
             fill="#B8C99A"
             opacity=".9"/>

    <ellipse cx="6" cy="0"
             rx="7" ry="11"
             fill="#D7E6BA"
             opacity=".9"/>

    <ellipse cx="0" cy="2"
             rx="2"
             ry="9"
             fill="#95A27D"/>

    <path d="M-1 -4 Q-6 -12 -9 -13"
          fill="none"
          stroke="#B8C99A"
          stroke-width="1"/>

    <path d="M1 -4 Q6 -12 9 -13"
          fill="none"
          stroke="#B8C99A"
          stroke-width="1"/>

    <!-- wing flutter -->
    <animateTransform
      attributeName="transform"
      type="scale"
      values="1 1; .65 1; 1 1"
      dur=".6s"
      repeatCount="indefinite"/>

  </g>

</defs>


<!-- HEADER -->

<text x="60"
      y="65"
      font-family="monospace"
      font-size="14"
      letter-spacing="5"
      fill="#72805F">

  PROJECTS // CURRENT BUILDS

</text>

<text x="1140"
      y="65"
      text-anchor="end"
      font-family="monospace"
      font-size="13"
      fill="#95A27D">

  ● 04 PROJECTS

</text>


<!-- ================================================= -->
<!-- CARD 1 -->
<!-- ================================================= -->

<g>

  <rect x="50"
