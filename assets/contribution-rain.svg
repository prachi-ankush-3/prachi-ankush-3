      <text x="40" y="88">solve</text>
      <text x="40" y="110">learn</text>
      <text x="40" y="132">repeat</text>
      <animateTransform attributeName="transform" type="translate" values="0 -80; 0 150" dur="6s" repeatCount="indefinite"/>
    </g>
    <g fill="#72805F">
