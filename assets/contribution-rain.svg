<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" role="img" aria-label="Contribution rain">
  <rect width="900" height="140" fill="#0D1117"/>
  <style>
    .r { font-family: "Courier New", Courier, monospace; font-size: 12px; }
  </style>
  <g class="r">
    <g fill="#95A27D">
      <text x="40" y="0">commit</text>
